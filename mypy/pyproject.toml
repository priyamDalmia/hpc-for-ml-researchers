[project]
name = "mypy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Priyam Dalmia", email = "dalmia.priyam@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "omegaconf>=2.3.0",
