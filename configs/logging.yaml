# config/logging.yaml DEFAULT 
# This is a simple logging setup for the Python logging.config.dictConfig functions 
# We initliaze the handlers, formatters and levels here. 

version: 1
disable_exisiting_loggers: false 


formatters:
  simple:
    format: '%(levelname)-8s %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

  detailed:
    format: '%(asctime)s %(module)-15s %(levelname)-7s %(message)s'
    datefmt: '>%m-%d %H:%M:%S'

handlers:
  stderr: 
    class: logging.StreamHandler
    level: WARNING
    formatter: simple 
    stream: ext://sys.stderr
  
  stdout:
    class: logging.StreamHandler
    level: DEBUG
    formatter: detailed 
    stream: ext://sys.stdout
  
  file-stdout:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/stdout.log
    maxBytes: 10000
    backupCount: 3

  file-stderr:
    class: logging.handlers.RotatingFileHandler
    level: WARNING 
    formatter: detailed
    filename: logs/error.log
    maxBytes: 10000
    backupCount: 3

loggers:
  root:
    level: DEBUG
    propogate: True
    handlers:
    - stderr
    - stdout
    - file-stderr
    - file-stdout


